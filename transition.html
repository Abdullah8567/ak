<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Practice</title>
    <style>
        h1{
            text-align:center;
            background-color: rgb(199, 197, 197);  
            font-weight: 100;
        }
        button{
            background-color: rgb(20, 75, 123);
            color: white;
            border: 2px solid black;
            height: 30px;
            width: 100px;
            /* animation: animation 5s linear infinite alternate; */
        }
        button:hover{
            background-color: rgb(84, 177, 194);
            color: white;
        }
         .search{
            margin-left: 50%;
                background-color: white;
                color: white;
                border: 2px solid black;
                border-top: 2px solid rgb(167, 163, 163);
                height: 50px;
                width: 50px;
                animation: animation 2s;
                Animation-timing-function: linear;
                animation-iteration-count: infinite;
                border-radius: 50%;
            }
        @keyframes animation{
            0%{
                transform: rotate(0deg);
            }
            /* 50%{ */
                /* transform: rotate(120deg); */
            /* } */
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Animation Practice</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt consequatur sit repellendus tempore placeat blanditiis autem ullam quasi ducimus! Sapiente odit voluptate, iure ullam unde vel sint eos pariatur similique.</p>
    <button>Click Me</button><br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <button class="search"></button>
</body>
</html>
